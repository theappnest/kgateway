# Configuration:
#
# Parent team1/parent-same-ns:
#   - Delegate /anything/team1 to team1/svc1-child
#
# Child team1/svc1-child:
#   - Route /anything/team1/foo to team1/svc1
#   - Parent parent-same-ns, with the parentRef namespace omitted so that it
#     defaults to the child's own namespace (team1)
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: parent-same-ns
  namespace: team1
spec:
  parentRefs:
  - name: gateway
    namespace: kgateway-base
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /anything/team1
    backendRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: svc1-child
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: svc1-child
  namespace: team1
spec:
  parentRefs:
  - name: parent-same-ns
    group: gateway.networking.k8s.io
    kind: HTTPRoute
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /anything/team1/foo
    backendRefs:
    - name: svc1
      port: 8000
