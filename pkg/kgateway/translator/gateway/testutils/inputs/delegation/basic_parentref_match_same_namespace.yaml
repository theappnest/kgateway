# This test contains a parent route that delegates to a child route in the same
# namespace, and the child has a parentRef pointing to the parent WITHOUT
# specifying a namespace. The parentRef namespace must default to the child's
# own namespace, so the child should attach and report status for the parent.
#
# Input:
# - Parent a/example-route:
#   - Delegate /a to matching routes in "a" namespace
# - Child a/route-a (with parentRef example-route, namespace omitted):
#   - /a/1 goes to a/example-svc
#
# Expected output routes:
# - /a/1/* -> a/svc-a
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-route
  namespace: a
spec:
  parentRefs:
  - name: example-gateway
    namespace: infra
  hostnames:
  - "example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /a
    backendRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: "*"
      namespace: a
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-a
  namespace: a
spec:
  parentRefs:
  - name: example-route
    group: gateway.networking.k8s.io
    kind: HTTPRoute
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /a/1
    backendRefs:
    - name: svc-a
      port: 8080
